<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>我的 Steam 游戏</title>
  <style>
    :root { color-scheme: dark; --bg:#10131a; --panel:#191e28; --muted:#9ba6b8; --text:#f2f5fa; --accent:#8ce0c2; --line:#2a3240; }
    * { box-sizing:border-box }
    body { margin:0; background:radial-gradient(ellipse at 80% -15%,#263d48 0,transparent 40%),var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1080px,calc(100% - 36px)); margin:0 auto; padding:64px 0 80px; }
    .eyebrow { color:var(--accent); text-transform:uppercase; letter-spacing:.16em; font-size:12px; font-weight:700 }
    h1 { margin:10px 0 8px; font-size:clamp(34px,7vw,58px); line-height:1.05; letter-spacing:-.04em }
    .intro { margin:0; color:var(--muted) }
    .stats { display:flex; gap:12px; flex-wrap:wrap; margin:28px 0 30px }
    .stat { background:rgba(25,30,40,.86); border:1px solid var(--line); border-radius:14px; padding:14px 18px; min-width:150px }
    .stat strong { display:block; font-size:22px; font-variant-numeric:tabular-nums }
    .stat span { color:var(--muted); font-size:13px }
    .toolbar { display:flex; gap:12px; margin-bottom:18px }
    input,select { color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:12px 14px; font:inherit; outline:none }
    input:focus,select:focus { border-color:var(--accent) }
    .export-row { display:flex; justify-content:flex-end; margin:-4px 0 18px }
    .export-button { border:0; border-radius:11px; padding:11px 16px; background:var(--accent); color:#10131a; font:700 14px system-ui,sans-serif; cursor:pointer }
    .export-button:hover { filter:brightness(1.08) }
    .export-button:disabled { opacity:.55; cursor:wait }
    input { flex:1; min-width:120px }
    .count { color:var(--muted); font-size:13px; margin:0 0 12px }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px }
    .card { position:relative; display:flex; align-items:flex-start; gap:16px; min-width:0; padding:12px; background:linear-gradient(135deg,rgba(28,34,45,.96),rgba(21,25,34,.96)); border:1px solid var(--line); border-radius:15px; transition:transform .16s,border-color .16s }
    .card:hover, .card:focus-within { transform:translateY(-2px); border-color:#58786f; z-index:5 }
    .details-popup { display:none; position:absolute; z-index:10; top:calc(100% + 8px); left:0; width:min(390px,calc(100vw - 40px)); overflow:hidden; background:#1b222e; border:1px solid #526477; border-radius:16px; box-shadow:0 18px 50px rgba(0,0,0,.58); }
    .card:hover .details-popup, .card:focus-within .details-popup { display:block }
    .details-popup img { display:block; width:100%; aspect-ratio:460/215; object-fit:cover; background:#283442 }
    .details-body { padding:16px }
    .details-title { margin:0 0 10px; font-size:19px; line-height:1.35; overflow-wrap:anywhere }
    .details-meta { color:var(--muted); font-size:14px; margin:5px 0 }
    .details-meta strong { color:var(--accent) }
    .details-link { display:inline-block; margin-top:12px; color:#10131a; background:var(--accent); padding:8px 12px; border-radius:9px; text-decoration:none; font-weight:700 }
    .art { width:120px; height:120px; flex:0 0 120px; border-radius:11px; overflow:hidden; background:#283442; display:grid; place-items:center; color:var(--accent); font-size:25px; font-weight:700 }
    .art img { width:100%; height:100%; object-fit:cover }
    .info { min-width:0; flex:1 }
    .name { color:var(--text); font-weight:650; text-decoration:none; display:block; white-space:normal; overflow-wrap:anywhere; line-height:1.35 }
    .name:hover { color:var(--accent) }
    .hours { margin-top:5px; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums }
    .hours b { color:var(--accent); font-size:17px }
    .message { grid-column:1/-1; color:var(--muted); background:var(--panel); border:1px solid var(--line); padding:20px; border-radius:14px }
    footer { margin-top:30px; color:var(--muted); font-size:12px }
    @media(max-width:540px) { main{padding-top:40px}.toolbar{flex-direction:column}.stat{flex:1;min-width:120px}.grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Steam library · personal collection</div>
    <h1>我的 Steam 游戏</h1>
    <p class="intro">一些玩过的游戏，以及我花在它们上的时间。</p>
    <section class="stats" aria-label="游戏统计">
      <div class="stat"><strong id="total-games">—</strong><span>款游戏</span></div>
      <div class="stat"><strong id="total-hours">—</strong><span>总游玩小时</span></div>
      <div class="stat"><strong id="top-game">—</strong><span>游玩最多</span></div>
    </section>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索游戏…" aria-label="搜索游戏">
      <select id="sort" aria-label="排序方式">
        <option value="hours-desc">游玩时间：从多到少</option>
        <option value="hours-asc">游玩时间：从少到多</option>
        <option value="name-asc">名称：A 到 Z</option>
      </select>
    </div>
    <div class="export-row"><button class="export-button" id="export" type="button" disabled>导出为图片</button></div>
    <p class="count" id="count"></p>
    <section class="grid" id="games" aria-live="polite"></section>
    <footer>游戏图片来自 Steam 商店；游玩时长来自这份游戏清单。</footer>
  </main>
  <script>
    const grid = document.querySelector('#games');
    const search = document.querySelector('#search');
    const sort = document.querySelector('#sort');
    const count = document.querySelector('#count');
    const exportButton = document.querySelector('#export');
    let allGames = [];

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (quoted && ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') quoted = !quoted;
        else if (ch === ',' && !quoted) { row.push(cell); cell = ''; }
        else if ((ch === '\n' || ch === '\r') && !quoted) {
          if (ch === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); if (row.some(v => v.trim())) rows.push(row);
          row = []; cell = '';
        } else cell += ch;
      }
      if (cell.length || row.length) { row.push(cell); rows.push(row); }
      const headers = rows.shift() || [];
      return rows.map(r => Object.fromEntries(headers.map((h, i) => [h.trim(), (r[i] || '').trim()])))
        .map(r => ({ name:r.Game, hours:Number(r['Hours Played']), appid:r['App ID'], icon:r['Icon URL'], cover:r.Cover }))
        .filter(g => g.name && Number.isFinite(g.hours));
    }


    function exportImage() {
      if (!allGames.length) return;
      exportButton.disabled = true;
      exportButton.textContent = '正在生成…';
      requestAnimationFrame(async () => {
        try {
          const games = [...allGames];
          if (sort.value === 'hours-asc') games.sort((a,b) => a.hours-b.hours);
          else if (sort.value === 'name-asc') games.sort((a,b) => a.name.localeCompare(b.name));
          else games.sort((a,b) => b.hours-a.hours);

          const width = 1600, margin = 56, gap = 22, columns = 2;
          const cardWidth = (width - margin * 2 - gap) / columns;
          const cardHeight = 112, rowGap = 14, headerHeight = 230;
          const rows = Math.ceil(games.length / columns);
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = headerHeight + margin + rows * (cardHeight + rowGap) + margin;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#10131a'; ctx.fillRect(0,0,width,canvas.height);
          const glow = ctx.createRadialGradient(width*.82,0,20,width*.82,0,650);
          glow.addColorStop(0,'#263d48'); glow.addColorStop(1,'#10131a');
          ctx.fillStyle = glow; ctx.fillRect(0,0,width,canvas.height);
          ctx.fillStyle = '#8ce0c2'; ctx.font = '700 18px system-ui,sans-serif';
          ctx.fillText('STEAM LIBRARY', margin, 58);
          ctx.fillStyle = '#f2f5fa'; ctx.font = '700 54px system-ui,sans-serif';
          ctx.fillText('我的 Steam 游戏', margin, 124);
          const totalHours = games.reduce((sum,g) => sum + g.hours, 0);
          ctx.fillStyle = '#aab5c5'; ctx.font = '20px system-ui,sans-serif';
          ctx.fillText(games.length + ' 款游戏     ·     ' + Math.round(totalHours).toLocaleString('zh-CN') + ' 小时', margin, 170);
          ctx.font = '14px system-ui,sans-serif'; ctx.fillText(new Date().toLocaleDateString('zh-CN'), margin, 202);

          function wrap(text, maxWidth, font) {
            ctx.font = font;
            const lines = []; let line = '';
            for (const char of text) {
              if (line && ctx.measureText(line + char).width > maxWidth) { lines.push(line); line = char; }
              else line += char;
            }
            if (line) lines.push(line);
            return lines;
          }
          const coverImages = await Promise.all(games.map(game => new Promise(resolve => {
            if (!game.cover) { resolve(null); return; }
            const image = new Image();
            image.onload = () => resolve(image);
            image.onerror = () => resolve(null);
            image.src = new URL(game.cover, document.baseURI).href;
          })));
          games.forEach((game,index) => {
            const col = index % columns, row = Math.floor(index / columns);
            const x = margin + col * (cardWidth + gap);
            const y = headerHeight + margin + row * (cardHeight + rowGap);
            ctx.fillStyle = '#1b222e'; ctx.beginPath(); ctx.roundRect(x,y,cardWidth,cardHeight,16); ctx.fill();
            ctx.fillStyle = '#283442'; ctx.beginPath(); ctx.roundRect(x+14,y+14,84,84,13); ctx.fill();
            if (coverImages[index]) {
              ctx.save(); ctx.beginPath(); ctx.roundRect(x+14,y+14,84,84,13); ctx.clip();
              ctx.drawImage(coverImages[index],x+14,y+14,84,84); ctx.restore();
            } else {
              ctx.fillStyle = '#8ce0c2'; ctx.font = '700 30px system-ui,sans-serif';
              ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
              ctx.fillText(game.name.slice(0,1).toLocaleUpperCase(),x+56,y+56);
              ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            }
            const lines = wrap(game.name,cardWidth-140,'600 19px system-ui,sans-serif');
            ctx.fillStyle = '#f2f5fa'; ctx.font = '600 19px system-ui,sans-serif';
            lines.slice(0,3).forEach((line,lineIndex) => ctx.fillText(line,x+116,y+37+lineIndex*24));
            ctx.fillStyle = '#8ce0c2'; ctx.font = '16px system-ui,sans-serif';
            ctx.fillText(game.hours.toLocaleString('zh-CN',{maximumFractionDigits:1}) + ' 小时',x+116,y+96);
          });

          canvas.toBlob(blob => {
            if (!blob) { exportButton.textContent = '导出失败，请重试'; exportButton.disabled = false; return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'steam-games-' + new Date().toISOString().slice(0,10) + '.png';
            a.click(); setTimeout(() => URL.revokeObjectURL(url),1000);
            exportButton.textContent = '导出为图片';
            exportButton.disabled = false;
          },'image/png');
        } catch (error) {
          exportButton.textContent = '导出失败，请重试';
          exportButton.disabled = false;
        }
      });
    }

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      const games = allGames.filter(g => g.name.toLocaleLowerCase().includes(query));
      if (sort.value === 'hours-asc') games.sort((a,b) => a.hours-b.hours);
      else if (sort.value === 'name-asc') games.sort((a,b) => a.name.localeCompare(b.name));
      else games.sort((a,b) => b.hours-a.hours);
      count.textContent = `显示 ${games.length} / ${allGames.length} 款游戏`;
      grid.replaceChildren();
      if (!games.length) { grid.innerHTML = '<div class="message">没有找到匹配的游戏。</div>'; return; }
      for (const game of games) {
        const card = document.createElement('article'); card.className = 'card';
        const art = document.createElement('div'); art.className = 'art'; art.textContent = game.name.slice(0,1).toUpperCase();
        const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy';
        const images = [
          game.cover,
          `https://cdn.akamai.steamstatic.com/steam/apps/${encodeURIComponent(game.appid)}/library_600x900.jpg`,
          game.icon,
          `https://cdn.akamai.steamstatic.com/steam/apps/${encodeURIComponent(game.appid)}/header.jpg`
        ].filter(Boolean);
        let imageIndex = 0;
        img.onerror = () => { imageIndex++; if (imageIndex < images.length) img.src = images[imageIndex]; else img.remove(); };
        img.src = images[imageIndex]; art.append(img);
        const info = document.createElement('div'); info.className = 'info';
        const link = document.createElement('a'); link.className = 'name'; link.textContent = game.name; link.href = `https://store.steampowered.com/app/${encodeURIComponent(game.appid)}/`; link.target = '_blank'; link.rel = 'noopener noreferrer';
        const hours = document.createElement('div'); hours.className = 'hours'; hours.innerHTML = `<b>${game.hours.toLocaleString('zh-CN',{maximumFractionDigits:1})}</b> 小时`;
        info.append(link,hours); card.append(art,info);
        const popup = document.createElement('div'); popup.className = 'details-popup';
        const cover = document.createElement('img'); cover.src = 'https://cdn.akamai.steamstatic.com/steam/apps/' + encodeURIComponent(game.appid) + '/header.jpg'; cover.alt = ''; cover.loading = 'lazy';
        const details = document.createElement('div'); details.className = 'details-body';
        const title = document.createElement('h2'); title.className = 'details-title'; title.textContent = game.name;
        const played = document.createElement('p'); played.className = 'details-meta'; played.textContent = '游玩时间：' + game.hours.toLocaleString('zh-CN',{maximumFractionDigits:1}) + ' 小时';
        const appid = document.createElement('p'); appid.className = 'details-meta'; appid.textContent = 'Steam App ID：' + game.appid;
        const storeLink = document.createElement('a'); storeLink.className = 'details-link'; storeLink.textContent = '查看 Steam 商店页面'; storeLink.href = link.href; storeLink.target = '_blank'; storeLink.rel = 'noopener noreferrer';
        details.append(title,played,appid,storeLink); popup.append(cover,details); card.append(popup); grid.append(card);
      }
    }

    fetch('./games.csv').then(r => { if (!r.ok) throw new Error('CSV 加载失败'); return r.text(); }).then(text => {
      allGames = parseCSV(text);
      const total = allGames.reduce((sum,g) => sum + g.hours, 0);
      document.querySelector('#total-games').textContent = allGames.length;
      document.querySelector('#total-hours').textContent = Math.round(total).toLocaleString('zh-CN');
      document.querySelector('#top-game').textContent = [...allGames].sort((a,b) => b.hours-a.hours)[0]?.name || '—';
      render();
      exportButton.disabled = false;
    }).catch(() => { grid.innerHTML = '<div class="message">暂时无法读取 games.csv。请确认它与 index.html 在同一目录。</div>'; });
    exportButton.addEventListener('click', exportImage);
    search.addEventListener('input', render);
    sort.addEventListener('change', render);
  </script>
</body>
</html>
